<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="100%" height="100%">
  <defs>
    <linearGradient id="tvFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="tvShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="28" flood-color="#00D2FF" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.9" />
    </filter>
    <filter id="focusRing" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00D2FF" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- TV Chassis Base Stand -->
  <polygon points="260,390 420,390 440,410 240,410" fill="url(#standGrad)" opacity="0.9" />
  <rect x="330" y="360" width="20" height="32" fill="#1E293B" />

  <!-- Outer Television Chassis -->
  <rect x="20" y="20" width="640" height="360" rx="14" ry="14" fill="url(#tvFrame)" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4" filter="url(#tvShadow)" />
  <!-- TV Inner Bezel -->
  <rect x="25" y="25" width="630" height="350" rx="10" ry="10" fill="#000000" stroke="#1E293B" stroke-width="1.5" />

  <!-- Screen Content: 10-foot Leanback Android TV UI -->
  <g id="tvScreen">
    <rect x="28" y="28" width="624" height="344" rx="8" ry="8" fill="#080B11" />

    <!-- TV Top Header Bar -->
    <rect x="28" y="28" width="624" height="46" fill="#0d1424" />
    <!-- App Logo Icon -->
    <rect x="44" y="38" width="26" height="26" rx="6" fill="#00D2FF" fill-opacity="0.2" stroke="#00D2FF" stroke-width="1" />
    <text x="57" y="55" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#00D2FF" text-anchor="middle">V</text>
    <text x="80" y="55" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">VerseStream <tspan fill="#64748B" font-size="11" font-weight="600">TV ENGINE</tspan></text>

    <!-- TV Navigation Tabs (Leanback style) -->
    <text x="240" y="55" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#00D2FF">Featured</text>
    <rect x="238" y="66" width="52" height="3" rx="1.5" fill="#00D2FF" />

    <text x="320" y="55" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Live IPTV (1,000+)</text>
    <text x="440" y="55" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Extensions</text>
    <text x="530" y="55" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Media Hub</text>

    <text x="616" y="55" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="end">14:45 • 4K HDR</text>

    <!-- Hero Spotlight Banner (Top half of Leanback UI) -->
    <rect x="44" y="86" width="592" height="135" rx="10" fill="#0c172e" stroke="#1E293B" stroke-width="1" />
    
    <!-- Spotlight Info -->
    <rect x="60" y="98" width="60" height="18" rx="4" fill="#00D2FF" fill-opacity="0.2" stroke="#00D2FF" stroke-width="1" />
    <text x="90" y="111" font-family="'Inter', sans-serif" font-size="8" font-weight="800" fill="#00D2FF" text-anchor="middle">LEANBACK 4K</text>
    <text x="60" y="142" font-family="'Inter', sans-serif" font-size="20" font-weight="900" fill="#ffffff">CYBER HORIZON: REVOLUTION</text>
    <text x="60" y="162" font-family="'Inter', sans-serif" font-size="10" font-weight="400" fill="#94A3B8">Native hardware pass-through • 5.1 Dolby Surround • M3U Custom Feed</text>
    
    <!-- Remote Control Button: Play Now (Focused) -->
    <g filter="url(#focusRing)">
      <rect x="60" y="176" width="105" height="28" rx="6" fill="#00D2FF" />
      <polygon points="76,186 86,190 76,194" fill="#080B11" />
      <text x="94" y="194" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#080B11">PLAY STREAM</text>
    </g>

    <!-- Remote Control Button: Select Audio Track -->
    <rect x="175" y="176" width="115" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="232" y="194" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">Audio & Tracks</text>

    <!-- Leanback Horizontal Carousel Shelf -->
    <text x="44" y="244" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#CBD5E1">CONTINUE WATCHING & RECENT FEEDS</text>

    <!-- Carousel Item 1 (Focused item with Glowing Neon Border!) -->
    <g filter="url(#focusRing)">
      <rect x="44" y="254" width="134" height="100" rx="8" fill="#111c33" stroke="#00D2FF" stroke-width="2.5" />
      <text x="54" y="325" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#ffffff">Galactic Odyssey</text>
      <text x="54" y="340" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#00D2FF">RESUME • 10-BIT AV1</text>
    </g>

    <!-- Carousel Item 2 -->
    <rect x="190" y="254" width="134" height="100" rx="8" fill="#0e172a" stroke="#1E293B" stroke-width="1" />
    <text x="200" y="325" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#ffffff">Neo Tokyo Chronicles</text>
    <text x="200" y="340" font-family="'Inter', sans-serif" font-size="8" font-weight="500" fill="#94A3B8">EPISODE 02</text>

    <!-- Carousel Item 3 -->
    <rect x="336" y="254" width="134" height="100" rx="8" fill="#0e172a" stroke="#1E293B" stroke-width="1" />
    <text x="346" y="325" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#ffffff">Quantum Nexus</text>
    <text x="346" y="340" font-family="'Inter', sans-serif" font-size="8" font-weight="500" fill="#94A3B8">DOCU-SERIES</text>

    <!-- Carousel Item 4 -->
    <rect x="482" y="254" width="134" height="100" rx="8" fill="#0e172a" stroke="#1E293B" stroke-width="1" />
    <text x="492" y="325" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#ffffff">Aurora Borealis Live</text>
    <text x="492" y="340" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#10B981">LIVE PUBLIC FEED</text>
  </g>
</svg>
