<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="100%" height="100%">
  <defs>
    <linearGradient id="tabFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="tabShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="28" flood-color="#6366F1" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Tablet Bezel with Soft Curved Corners -->
  <rect x="20" y="20" width="560" height="400" rx="28" ry="28" fill="url(#tabFrame)" stroke="#818CF8" stroke-width="2" stroke-opacity="0.4" filter="url(#tabShadow)" />
  <rect x="26" y="26" width="548" height="388" rx="22" ry="22" fill="#050811" stroke="#334155" stroke-width="1" />

  <!-- Tablet Screen: Multi-Pane Split View -->
  <g id="tabScreen">
    <rect x="30" y="30" width="540" height="380" rx="18" ry="18" fill="#080B11" />

    <!-- Left Column: Navigation Sidebar (120px) -->
    <rect x="30" y="30" width="120" height="380" fill="#0B111E" />
    <line x1="150" y1="30" x2="150" y2="410" stroke="#1E293B" stroke-width="1" />

    <!-- Sidebar Brand -->
    <rect x="44" y="46" width="22" height="22" rx="5" fill="#00D2FF" fill-opacity="0.2" stroke="#00D2FF" stroke-width="1" />
    <text x="55" y="61" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#00D2FF" text-anchor="middle">V</text>
    <text x="74" y="62" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#ffffff">VerseStream</text>

    <!-- Sidebar Nav items -->
    <rect x="38" y="90" width="104" height="28" rx="6" fill="#00D2FF" fill-opacity="0.15" stroke="#00D2FF" stroke-width="1" />
    <text x="50" y="108" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#00D2FF">Dashboard</text>

    <text x="50" y="142" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Live M3U Feeds</text>
    <text x="50" y="174" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Self-Hosted NAS</text>
    <text x="50" y="206" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Extensions (14)</text>
    <text x="50" y="238" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Audio Engine</text>
    <text x="50" y="270" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Settings</text>

    <!-- Session Pass Pill in Sidebar -->
    <rect x="38" y="340" width="104" height="48" rx="8" fill="#111827" stroke="#10B981" stroke-width="1" />
    <text x="48" y="358" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#10B981">UNINTERRUPTED PASS</text>
    <text x="48" y="375" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#ffffff">2h 45m left</text>

    <!-- Middle Column: Media Stream Catalogue (250px) -->
    <text x="166" y="60" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#ffffff">Decentralized Catalogue</text>
    <text x="166" y="74" font-family="'Inter', sans-serif" font-size="8" fill="#64748B">3rd-Party Verified Sources • Zero Scraping</text>

    <!-- Grid Cards in Catalogue -->
    <rect x="166" y="88" width="108" height="140" rx="8" fill="#0d1527" stroke="#1E293B" stroke-width="1" />
    <text x="174" y="206" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffffff">Cyber Horizon</text>
    <text x="174" y="218" font-family="'Inter', sans-serif" font-size="7" fill="#00D2FF">4K HDR • 5.1 CH</text>

    <rect x="284" y="88" width="108" height="140" rx="8" fill="#0d1527" stroke="#1E293B" stroke-width="1" />
    <text x="292" y="206" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffffff">Galactic Odyssey</text>
    <text x="292" y="218" font-family="'Inter', sans-serif" font-size="7" fill="#818CF8">AV1 10-BIT</text>

    <!-- Lower Row -->
    <rect x="166" y="240" width="108" height="140" rx="8" fill="#0d1527" stroke="#1E293B" stroke-width="1" />
    <text x="174" y="358" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffffff">Neo Tokyo</text>
    <text x="174" y="370" font-family="'Inter', sans-serif" font-size="7" fill="#F472B6">1080P 60FPS</text>

    <rect x="284" y="240" width="108" height="140" rx="8" fill="#0d1527" stroke="#1E293B" stroke-width="1" />
    <text x="292" y="358" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffffff">Aurora Live</text>
    <text x="292" y="370" font-family="'Inter', sans-serif" font-size="7" fill="#10B981">LIVE STREAM</text>

    <!-- Right Column: Split-View Floating Player & Stream Inspector (160px) -->
    <line x1="404" y1="30" x2="404" y2="410" stroke="#1E293B" stroke-width="1" />
    
    <!-- Mini Player Screen -->
    <rect x="414" y="44" width="144" height="96" rx="8" fill="#030712" stroke="#00D2FF" stroke-width="1.5" />
    <polygon points="480,82 496,92 480,102" fill="#00D2FF" />
    <text x="422" y="60" font-family="'Inter', sans-serif" font-size="7" font-weight="800" fill="#00D2FF">LIVE HARDWARE ACCEL</text>

    <!-- Stream Inspector Details -->
    <text x="414" y="160" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#ffffff">Engine Telemetry</text>
    
    <rect x="414" y="172" width="144" height="26" rx="5" fill="#111827" />
    <text x="422" y="188" font-family="'Inter', sans-serif" font-size="8" fill="#94A3B8">Resolution: <tspan fill="#ffffff" font-weight="700">3840 x 2160</tspan></text>

    <rect x="414" y="204" width="144" height="26" rx="5" fill="#111827" />
    <text x="422" y="220" font-family="'Inter', sans-serif" font-size="8" fill="#94A3B8">Bitrate: <tspan fill="#00D2FF" font-weight="700">28.4 Mbps CBR</tspan></text>

    <rect x="414" y="236" width="144" height="26" rx="5" fill="#111827" />
    <text x="422" y="252" font-family="'Inter', sans-serif" font-size="8" fill="#94A3B8">Decoder: <tspan fill="#818CF8" font-weight="700">MediaCodec HW</tspan></text>

    <rect x="414" y="268" width="144" height="26" rx="5" fill="#111827" />
    <text x="422" y="284" font-family="'Inter', sans-serif" font-size="8" fill="#94A3B8">Audio Pass: <tspan fill="#10B981" font-weight="700">Dolby TrueHD</tspan></text>

    <!-- Multi-CDN Fallback Node Status -->
    <rect x="414" y="310" width="144" height="70" rx="8" fill="#08101E" stroke="#1E293B" stroke-width="1" />
    <text x="422" y="326" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#38BDF8">ACTIVE CDN NODES</text>
    <circle cx="426" cy="342" r="3" fill="#10B981" />
    <text x="434" y="345" font-family="'Inter', sans-serif" font-size="8" fill="#E2E8F0">Primary CDN (8ms)</text>
    <circle cx="426" cy="360" r="3" fill="#38BDF8" />
    <text x="434" y="363" font-family="'Inter', sans-serif" font-size="8" fill="#94A3B8">Backup CDN (18ms)</text>
  </g>
</svg>
