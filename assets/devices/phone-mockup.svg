<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="50%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="screenGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="pipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#00D2FF" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="neonPip" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00D2FF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Bezel / Chassis with Drop Shadow -->
  <rect x="20" y="20" width="320" height="700" rx="44" ry="44" fill="url(#phoneFrame)" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.5" filter="url(#phoneShadow)" />
  <!-- Inner Rim Border -->
  <rect x="26" y="26" width="308" height="688" rx="38" ry="38" fill="#030712" stroke="#64748B" stroke-width="1" />

  <!-- AMOLED Screen Area -->
  <rect x="32" y="32" width="296" height="676" rx="32" ry="32" fill="#080B11" />

  <!-- Screen Content: VerseStream Gestural Player UI -->
  <!-- Top Video Frame (Cyber Horizon Playing) -->
  <g id="screenContent">
    <rect x="32" y="70" width="296" height="230" fill="#0a1224" />
    <!-- Mini Graphic inside player -->
    <circle cx="180" cy="185" r="50" fill="#00D2FF" opacity="0.15" />
    <polygon points="172,170 196,185 172,200" fill="#00D2FF" />
    
    <!-- Player Top Bar Overlay -->
    <rect x="32" y="70" width="296" height="40" fill="linear-gradient(to bottom, #000000cc, transparent)" />
    <!-- Back arrow -->
    <path d="M 48 90 L 58 82 M 48 90 L 58 98 M 48 90 L 64 90" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <text x="74" y="94" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Cyber Horizon • 4K UHD</text>
    <rect x="260" y="83" width="54" height="16" rx="8" fill="#00D2FF" fill-opacity="0.2" stroke="#00D2FF" stroke-width="1" />
    <text x="287" y="94" font-family="'Inter', sans-serif" font-size="8" font-weight="800" fill="#00D2FF" text-anchor="middle">HDR10+</text>

    <!-- Player Bottom Scrubber Controls -->
    <rect x="32" y="260" width="296" height="40" fill="linear-gradient(to top, #000000cc, transparent)" />
    <!-- Track line -->
    <line x1="48" y1="280" x2="312" y2="280" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    <line x1="48" y1="280" x2="210" y2="280" stroke="#00D2FF" stroke-width="3" stroke-linecap="round" />
    <circle cx="210" cy="280" r="5" fill="#ffffff" stroke="#00D2FF" stroke-width="2" />
    <text x="48" y="295" font-family="'Inter', sans-serif" font-size="8" fill="#94A3B8">42:18 / 1:56:04</text>
    <text x="285" y="295" font-family="'Inter', sans-serif" font-size="8" fill="#00D2FF" font-weight="700">PASS: 2h 48m</text>

    <!-- Gestural HUD Indicators (Brightness/Volume Swipes) -->
    <rect x="42" y="130" width="24" height="70" rx="12" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <rect x="50" y="155" width="8" height="35" rx="4" fill="#00D2FF" />
    <text x="54" y="145" font-family="'Inter', sans-serif" font-size="7" fill="#ffffff" text-anchor="middle">VOL</text>

    <rect x="294" y="130" width="24" height="70" rx="12" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <rect x="302" y="145" width="8" height="45" rx="4" fill="#6366F1" />
    <text x="306" y="145" font-family="'Inter', sans-serif" font-size="7" fill="#ffffff" text-anchor="middle">BRT</text>

    <!-- Quick Audio Stream Selector -->
    <rect x="44" y="318" width="80" height="26" rx="13" fill="#1E293B" stroke="#00D2FF" stroke-width="1" />
    <text x="84" y="335" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#00D2FF" text-anchor="middle">Dolby 5.1 En</text>

    <rect x="132" y="318" width="76" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="170" y="335" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="middle">Subtitles: Auto</text>

    <rect x="216" y="318" width="88" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="260" y="335" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="middle">Speed: 1.0x</text>

    <!-- Source Provider Extension Indicator (Legal Self-Hosted) -->
    <rect x="44" y="356" width="272" height="42" rx="10" fill="#0c1220" stroke="#1e293b" stroke-width="1" />
    <circle cx="62" cy="377" r="7" fill="#10B981" />
    <text x="76" y="374" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Decentralized Web Feed</text>
    <text x="76" y="388" font-family="'Inter', sans-serif" font-size="8" fill="#64748B">CDN-Primary (Ping: 9ms • Buffer: 120s)</text>

    <!-- Floating Picture-in-Picture (PiP) Window Demo -->
    <g transform="translate(185, 415)" filter="url(#neonPip)">
      <rect width="130" height="85" rx="12" fill="url(#pipGrad)" stroke="#00D2FF" stroke-width="2" />
      <!-- PiP Screen simulation -->
      <rect x="4" y="4" width="122" height="77" rx="8" fill="#040714" />
      <polygon points="58,35 74,45 58,55" fill="#00D2FF" />
      <rect x="8" y="8" width="40" height="12" rx="6" fill="#00D2FF" fill-opacity="0.3" />
      <text x="28" y="17" font-family="'Inter', sans-serif" font-size="7" font-weight="800" fill="#00D2FF" text-anchor="middle">PiP ACTIVE</text>
    </g>

    <!-- Bottom Queue List -->
    <text x="44" y="425" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#ffffff">Queue Next Up</text>
    
    <rect x="44" y="440" width="130" height="56" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <text x="54" y="460" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Galactic Odyssey</text>
    <text x="54" y="474" font-family="'Inter', sans-serif" font-size="8" fill="#64748B">Ep. 05 • 4K HDR</text>

    <!-- Lower Category Stream Feeds -->
    <rect x="44" y="515" width="272" height="60" rx="10" fill="#0B132B" stroke="#6366F1" stroke-width="1" stroke-opacity="0.4" />
    <text x="58" y="538" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#A5B4FC">IPTV M3U Live Broadcasts</text>
    <text x="58" y="555" font-family="'Inter', sans-serif" font-size="8" fill="#94A3B8">Connected: 1,420 Global Open Feeds</text>

    <!-- Bottom Android Navigation Pill Bar -->
    <rect x="44" y="640" width="272" height="48" rx="24" fill="#030712" stroke="#1E293B" stroke-width="1" />
    <circle cx="85" cy="664" r="12" fill="#00D2FF" fill-opacity="0.2" />
    <polygon points="82,658 92,664 82,670" fill="#00D2FF" />
    <circle cx="180" cy="664" r="12" fill="#1E293B" />
    <circle cx="275" cy="664" r="12" fill="#1E293B" />
  </g>

  <!-- Top Camera Punch-Hole & Speaker Grill -->
  <circle cx="180" cy="48" r="5" fill="#000000" stroke="#1E293B" stroke-width="1.5" />
  <rect x="155" y="37" width="50" height="3" rx="1.5" fill="#334155" />

  <!-- Diagonal Glass Sheen Reflection -->
  <path d="M 32 180 L 220 32 L 310 32 L 32 310 Z" fill="url(#screenGloss)" pointer-events="none" />
</svg>
