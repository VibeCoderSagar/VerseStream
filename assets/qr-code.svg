    <rect x="25" y="80" width="10" height="10" rx="3" />
    <rect x="45" y="80" width="20" height="10" rx="3" />
    <rect x="75" y="75" width="12" height="12" rx="3" />
    <rect x="95" y="75" width="15" height="15" rx="4" />
    <rect x="120" y="80" width="10" height="10" rx="3" />
    <rect x="140" y="80" width="20" height="10" rx="3" />
    <rect x="170" y="80" width="10" height="10" rx="3" />

    <rect x="25" y="100" width="20" height="10" rx="3" />
    <rect x="55" y="100" width="10" height="10" rx="3" />
    <rect x="75" y="100" width="20" height="20" rx="4" />
    <rect x="105" y="100" width="15" height="10" rx="3" />
    <rect x="130" y="100" width="10" height="20" rx="3" />
    <rect x="150" y="100" width="25" height="10" rx="3" />

    <rect x="80" y="130" width="10" height="10" rx="3" />
