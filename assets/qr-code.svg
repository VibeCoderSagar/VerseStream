<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="100%" stop-color="#FF8A00" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="#0E0E14" stroke="#252533" stroke-width="2" />
  
  <!-- Outer Corner Position Locators -->
  <!-- Top Left -->
  <rect x="25" y="25" width="45" height="45" rx="10" fill="none" stroke="url(#qrGrad)" stroke-width="5" />
  <rect x="36" y="36" width="23" height="23" rx="5" fill="#FF385C" />
  
  <!-- Top Right -->
  <rect x="130" y="25" width="45" height="45" rx="10" fill="none" stroke="url(#qrGrad)" stroke-width="5" />
  <rect x="141" y="36" width="23" height="23" rx="5" fill="#FF385C" />
  
  <!-- Bottom Left -->
  <rect x="25" y="130" width="45" height="45" rx="10" fill="none" stroke="url(#qrGrad)" stroke-width="5" />
  <rect x="36" y="141" width="23" height="23" rx="5" fill="#FF385C" />

  <!-- QR Matrix Modules -->
  <g fill="url(#qrGrad)">
    <rect x="80" y="25" width="10" height="10" rx="3" />
