    <rect x="130" y="150" width="15" height="10" rx="3" />
    <rect x="155" y="150" width="10" height="10" rx="3" />

    <rect x="80" y="170" width="10" height="10" rx="3" />
    <rect x="130" y="170" width="20" height="10" rx="3" />
    <rect x="160" y="165" width="15" height="15" rx="3" />
