<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Coral Red to Sunset Orange Gradient matching user logo -->
    <linearGradient id="verseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="45%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#FF8A00" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#FF385C" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#FF8A00" flood-opacity="0.3" />
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="36" y="36" width="440" height="440" rx="115" ry="115" fill="url(#verseGrad)" filter="url(#shadow)" />

  <!-- Subtle Specular Highlights -->
  <path d="M 36 151 C 36 87 87 36 151 36 L 361 36 C 260 110 180 240 36 360 Z" fill="#ffffff" opacity="0.12" />

  <!-- Left Accent Dot / Rounded Square -->
  <rect x="135" y="222" width="68" height="68" rx="22" ry="22" fill="#ffffff" opacity="0.85" />

  <!-- Right Play Triangle Mark -->
  <polygon points="255,145 425,256 255,367" fill="#ffffff" filter="url(#softGlow)" />
</svg>
