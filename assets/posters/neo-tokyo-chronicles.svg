<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="rainSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020408" />
      <stop offset="60%" stop-color="#070c1e" />
      <stop offset="100%" stop-color="#140727" />
    </linearGradient>
    <linearGradient id="neonPinkCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="neonBlur">
      <feGaussianBlur stdDeviation="7" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="600" fill="url(#rainSky)" />

  <!-- Rain Streaks -->
  <g stroke="#38BDF8" stroke-width="0.8" opacity="0.35">
    <line x1="40" y1="20" x2="30" y2="70" />
    <line x1="120" y1="40" x2="110" y2="90" />
    <line x1="220" y1="10" x2="210" y2="60" />
    <line x1="320" y1="50" x2="310" y2="100" />
    <line x1="70" y1="150" x2="60" y2="200" />
    <line x1="170" y1="120" x2="160" y2="170" />
    <line x1="270" y1="140" x2="260" y2="190" />
    <line x1="360" y1="130" x2="350" y2="180" />
  </g>

  <!-- Skyscraper Structures -->
  <rect x="20" y="160" width="80" height="360" fill="#060a17" stroke="#1e293b" stroke-width="1" />
  <rect x="110" y="100" width="90" height="420" fill="#080e22" stroke="#1e293b" stroke-width="1" />
  <rect x="210" y="140" width="85" height="380" fill="#050813" stroke="#1e293b" stroke-width="1" />
  <rect x="305" y="180" width="80" height="340" fill="#090f26" stroke="#1e293b" stroke-width="1" />

  <!-- Cyber Hologram Signs on Buildings -->
  <!-- Japanese Stylized Neon Sign (Tokyo) -->
  <rect x="125" y="140" width="22" height="110" rx="4" fill="#FF007F" fill-opacity="0.15" stroke="#FF007F" stroke-width="1.5" filter="url(#neonBlur)" />
  <text x="136" y="170" font-family="'Inter', sans-serif" font-size="14" font-weight="900" fill="#FF007F" text-anchor="middle">新</text>
  <text x="136" y="200" font-family="'Inter', sans-serif" font-size="14" font-weight="900" fill="#FF007F" text-anchor="middle">東</text>
  <text x="136" y="230" font-family="'Inter', sans-serif" font-size="14" font-weight="900" fill="#00D2FF" text-anchor="middle">京</text>

  <!-- Cyan Holographic Billboard -->
  <rect x="225" y="170" width="55" height="35" rx="3" fill="#00D2FF" fill-opacity="0.2" stroke="#00D2FF" stroke-width="1.5" filter="url(#neonBlur)" />
  <text x="252" y="192" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#00D2FF" text-anchor="middle">NEO-NET</text>

  <!-- Street Reflections in Rain / Wet Asphalt -->
  <polygon points="0,500 400,500 400,600 0,600" fill="#03050a" />
  <ellipse cx="140" cy="510" rx="60" ry="10" fill="#FF007F" opacity="0.35" filter="url(#neonBlur)" />
  <ellipse cx="250" cy="510" rx="70" ry="12" fill="#00D2FF" opacity="0.4" filter="url(#neonBlur)" />

  <!-- Holographic Beam In Sky -->
  <polygon points="150,0 160,0 200,300 110,300" fill="#00D2FF" opacity="0.08" />

  <!-- Badge -->
  <rect x="24" y="24" width="76" height="22" rx="4" fill="#FF007F" fill-opacity="0.2" stroke="#FF007F" stroke-width="1" />
  <text x="62" y="39" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#F472B6" text-anchor="middle" letter-spacing="1">ULTRA HD</text>

  <text x="24" y="530" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="0.5">NEO TOKYO CHRONICLES</text>
  <text x="24" y="555" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#94A3B8" letter-spacing="1.5">FUTURISTIC NOIR • SEASON 2</text>
  <text x="24" y="575" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#00D2FF">DYNAMIC RANGE: HDR10+ MASTER</text>
</svg>
