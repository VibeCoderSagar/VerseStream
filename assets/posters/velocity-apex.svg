<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="speedBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a050f" />
      <stop offset="60%" stop-color="#180a24" />
      <stop offset="100%" stop-color="#040206" />
    </linearGradient>
    <linearGradient id="lightTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.9" />
    </linearGradient>
    <filter id="speedGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="600" fill="url(#speedBg)" />

  <!-- Speed Motion Blur Lines -->
  <g stroke="#ffffff" opacity="0.15" stroke-width="1.5">
    <line x1="50" y1="50" x2="120" y2="140" />
    <line x1="180" y1="20" x2="220" y2="100" />
    <line x1="320" y1="40" x2="350" y2="130" />
    <line x1="20" y1="180" x2="80" y2="280" />
    <line x1="330" y1="180" x2="380" y2="280" />
  </g>

  <!-- Curving Neon Light Trails -->
  <path d="M -50 420 C 120 400, 260 320, 450 360" fill="none" stroke="url(#lightTrail)" stroke-width="6" filter="url(#speedGlow)" />
  <path d="M -50 440 C 100 420, 240 340, 450 380" fill="none" stroke="#EF4444" stroke-width="8" filter="url(#speedGlow)" />
  <path d="M -50 450 C 90 430, 230 350, 450 390" fill="none" stroke="#00D2FF" stroke-width="4" filter="url(#speedGlow)" />

  <!-- Hypercar Aerodynamic Silhouette -->
  <!-- Low Aggressive Body -->
  <path d="M 60 410 Q 140 360, 240 365 Q 310 375, 345 405 L 330 420 Q 240 415, 75 422 Z" fill="#1e1b2e" stroke="#38BDF8" stroke-width="1.5" />
  <!-- Cockpit Windshield -->
  <path d="M 160 372 Q 200 352, 235 365 L 225 375 L 175 375 Z" fill="#00D2FF" opacity="0.6" filter="url(#speedGlow)" />
  <!-- Wheel Arches & Neon Wheels -->
  <circle cx="110" cy="420" r="22" fill="#0f0e17" stroke="#00D2FF" stroke-width="3" filter="url(#speedGlow)" />
  <circle cx="295" cy="415" r="22" fill="#0f0e17" stroke="#F59E0B" stroke-width="3" filter="url(#speedGlow)" />

  <!-- Speedometer HUD Ring Overlay in Top Right -->
  <circle cx="320" cy="100" r="45" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="160 60" />
  <circle cx="320" cy="100" r="45" fill="none" stroke="#00D2FF" stroke-width="4" stroke-dasharray="120 180" filter="url(#speedGlow)" />
  <text x="320" y="98" font-family="'Inter', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">342</text>
  <text x="320" y="112" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#00D2FF" text-anchor="middle">KM/H</text>

  <!-- Badges -->
  <rect x="24" y="24" width="76" height="22" rx="4" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1" />
  <text x="62" y="39" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#F87171" text-anchor="middle" letter-spacing="1">120 FPS</text>

  <text x="24" y="530" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="0.5">VELOCITY APEX</text>
  <text x="24" y="555" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#94A3B8" letter-spacing="1.5">HYPERCAR CIRCUIT TOURING</text>
  <text x="24" y="575" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#F59E0B">ZERO FRAME DROPS • HW ACCELERATED</text>
</svg>
