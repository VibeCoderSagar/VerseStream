<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020712" />
      <stop offset="50%" stop-color="#051622" />
      <stop offset="100%" stop-color="#030810" />
    </linearGradient>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#00D2FF" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#8B5CF6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.3" />
    </linearGradient>
    <filter id="auroraGlow">
      <feGaussianBlur stdDeviation="14" result="g1"/>
      <feMerge>
        <feMergeNode in="g1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="600" fill="url(#nightSky)" />

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="50" cy="50" r="1.2" opacity="0.9" />
    <circle cx="120" cy="90" r="1.5" opacity="0.8" />
    <circle cx="210" cy="40" r="1.3" opacity="0.7" />
    <circle cx="320" cy="80" r="1.6" opacity="0.85" />
    <circle cx="270" cy="140" r="1.2" opacity="0.6" />
    <circle cx="80" cy="180" r="1.5" opacity="0.8" />
  </g>

  <!-- Aurora Waves -->
  <path d="M -20 180 Q 80 80, 180 160 T 420 120 L 420 280 Q 280 200, 180 270 T -20 220 Z" fill="url(#auroraGrad)" opacity="0.75" filter="url(#auroraGlow)" />
  <path d="M -20 220 Q 90 140, 220 210 T 420 170 L 420 340 Q 290 270, 160 320 T -20 260 Z" fill="url(#auroraGrad)" opacity="0.5" filter="url(#auroraGlow)" />

  <!-- Snow Mountain Silhouettes -->
  <polygon points="-20,440 60,330 140,440" fill="#0b1728" />
  <polygon points="60,330 80,360 50,380 60,330" fill="#e2e8f0" opacity="0.4" />
  
  <polygon points="100,440 190,290 290,440" fill="#0d1b30" />
  <polygon points="190,290 210,330 175,345 190,290" fill="#e2e8f0" opacity="0.5" />
  
  <polygon points="250,440 330,320 420,440" fill="#091322" />
  <polygon points="330,320 350,355 315,370 330,320" fill="#e2e8f0" opacity="0.35" />

  <!-- Frozen Lake Reflection -->
  <rect x="0" y="440" width="400" height="160" fill="#040913" />
  <path d="M 0 460 Q 200 440, 400 460 L 400 500 Q 200 480, 0 500 Z" fill="#00D2FF" opacity="0.15" filter="url(#auroraGlow)" />
  <path d="M 0 510 Q 200 490, 400 510 L 400 540 Q 200 520, 0 540 Z" fill="#10B981" opacity="0.1" filter="url(#auroraGlow)" />

  <!-- Badges -->
  <rect x="24" y="24" width="76" height="22" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
  <text x="62" y="39" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="1">LIVE IP</text>

  <text x="24" y="530" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="0.5">AURORA BOREALIS</text>
  <text x="24" y="555" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#94A3B8" letter-spacing="1.5">4K 60FPS NATURE BROADCAST</text>
  <text x="24" y="575" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#10B981">PUBLIC OPEN FEED • 0% PACKET LOSS</text>
</svg>
