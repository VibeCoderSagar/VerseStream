<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="60%" stop-color="#0b1b3d" />
      <stop offset="85%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="neonSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="400" height="600" fill="url(#cyberSky)" />

  <!-- Stars -->
  <circle cx="50" cy="80" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="120" cy="40" r="1.2" fill="#00D2FF" opacity="0.9" />
  <circle cx="280" cy="90" r="1.5" fill="#ffffff" opacity="0.7" />
  <circle cx="340" cy="50" r="1" fill="#ec4899" opacity="0.9" />
  <circle cx="190" cy="110" r="2" fill="#38BDF8" opacity="0.8" />

  <!-- Neon Retro Cyber Sun -->
  <circle cx="200" cy="270" r="95" fill="url(#neonSun)" filter="url(#glow)" opacity="0.9" />
  <!-- Horizontal Sun Blind Stripes -->
  <rect x="90" y="270" width="220" height="4" fill="#0b1b3d" />
  <rect x="95" y="284" width="210" height="6" fill="#0b1b3d" />
  <rect x="105" y="300" width="190" height="8" fill="#0b1b3d" />
  <rect x="120" y="318" width="160" height="10" fill="#0b1b3d" />
  <rect x="140" y="338" width="120" height="12" fill="#0b1b3d" />

  <!-- Cyber Horizon Skyline Silhouettes -->
  <polygon points="40,360 40,290 65,270 75,360" fill="#070c1a" />
  <polygon points="75,360 75,220 100,220 100,360" fill="#0a1226" />
  <polygon points="100,360 100,250 130,250 130,360" fill="#060913" />
  <polygon points="130,360 130,210 145,190 160,210 160,360" fill="#0c1630" />
  <polygon points="240,360 240,215 270,215 270,360" fill="#0c1630" />
  <polygon points="270,360 270,260 300,260 300,360" fill="#070c1a" />
  <polygon points="300,360 300,200 330,230 330,360" fill="#0a1226" />
  <polygon points="330,360 330,280 360,280 360,360" fill="#060913" />

  <!-- Perspective Grid Floor -->
  <polygon points="0,360 400,360 400,600 0,600" fill="#040711" />
  <!-- Perspective Lines -->
  <line x1="200" y1="360" x2="-50" y2="600" stroke="url(#gridGrad)" stroke-width="1.5" />
  <line x1="200" y1="360" x2="50" y2="600" stroke="url(#gridGrad)" stroke-width="1.5" />
  <line x1="200" y1="360" x2="130" y2="600" stroke="url(#gridGrad)" stroke-width="1.5" />
  <line x1="200" y1="360" x2="200" y2="600" stroke="#00D2FF" stroke-width="2" filter="url(#glow)" />
  <line x1="200" y1="360" x2="270" y2="600" stroke="url(#gridGrad)" stroke-width="1.5" />
  <line x1="200" y1="360" x2="350" y2="600" stroke="url(#gridGrad)" stroke-width="1.5" />
  <line x1="200" y1="360" x2="450" y2="600" stroke="url(#gridGrad)" stroke-width="1.5" />

  <!-- Horizontal Grid Latitudes -->
  <line x1="0" y1="375" x2="400" y2="375" stroke="#00D2FF" stroke-opacity="0.3" stroke-width="1" />
  <line x1="0" y1="395" x2="400" y2="395" stroke="#00D2FF" stroke-opacity="0.4" stroke-width="1.2" />
  <line x1="0" y1="425" x2="400" y2="425" stroke="#00D2FF" stroke-opacity="0.5" stroke-width="1.5" />
  <line x1="0" y1="470" x2="400" y2="470" stroke="#00D2FF" stroke-opacity="0.6" stroke-width="2" />
  <line x1="0" y1="535" x2="400" y2="535" stroke="#00D2FF" stroke-opacity="0.8" stroke-width="2.5" />

  <!-- Vignette overlay -->
  <rect width="400" height="600" fill="none" stroke="#00D2FF" stroke-width="2" stroke-opacity="0.2" />

  <!-- Typography / Badge -->
  <rect x="24" y="24" width="70" height="22" rx="4" fill="#00D2FF" fill-opacity="0.2" stroke="#00D2FF" stroke-width="1" />
  <text x="59" y="39" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#00D2FF" text-anchor="middle" letter-spacing="1">4K HDR</text>

  <text x="24" y="530" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="0.5">CYBER HORIZON</text>
  <text x="24" y="555" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#94A3B8" letter-spacing="1.5">SCI-FI ODYSSEY • 2026</text>
  <text x="24" y="575" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#00D2FF">AUDIO: DOLBY ATMOS 5.1</text>
</svg>
